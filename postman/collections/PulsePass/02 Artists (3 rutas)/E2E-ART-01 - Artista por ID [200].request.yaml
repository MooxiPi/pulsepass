name: E2E-ART-01 | Artista por ID [200]
description: |-
  ID: E2E-ART-01
  Objetivo: Artista por ID
  Precondiciones: artistId real copiado de E2E-ART-03; artista activo del seed.
  Actor: ANONYMOUS
