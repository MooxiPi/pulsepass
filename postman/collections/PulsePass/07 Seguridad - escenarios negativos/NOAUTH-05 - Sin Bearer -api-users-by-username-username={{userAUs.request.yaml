$kind: http-request
name: NOAUTH-05 | Sin Bearer /api/users/by-username?username={{userAUsername}} [401]
description: |-
  ID: NOAUTH-05
  Objetivo: Sin Bearer /api/users/by-username?username={{userAUsername}}
  Precondiciones: USER_A registrado; buscar userAUsername sin Authorization.
  Actor: ANONYMOUS
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 401
  Revisión manual: ErrorResponse con timestamp, status, error, message y details; sin secretos.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/users/by-username?username={{userAUsername}}"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
order: 7000
