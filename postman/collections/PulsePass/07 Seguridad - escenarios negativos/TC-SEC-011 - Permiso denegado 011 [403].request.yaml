$kind: http-request
name: TC-SEC-011 | Permiso denegado 011 [403]
description: |-
  ID: TC-SEC-011
  Objetivo: Permiso denegado 011
  Precondiciones: ticketCancelableCode propio de A aún PAID; userBToken vigente; ejecutar antes de cancelación y releer como A.
  Actor: userB
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 403
  Revisión manual: 403 + ErrorResponse; USER_A confirma que ticketCancelableCode sigue PAID.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/tickets/{{ticketCancelableCode}}/cancel"
method: PATCH
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{userBToken}}"
order: 24000
