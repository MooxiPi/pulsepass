$kind: http-request
name: NOAUTH-07 | Sin Bearer /api/tickets/{{ticketCancelableCode}} [401]
description: |-
  ID: NOAUTH-07
  Objetivo: Sin Bearer /api/tickets/{{ticketCancelableCode}}
  Precondiciones: ticketCancelableCode propio de USER_A aún PAID; no enviar Authorization.
  Actor: ANONYMOUS
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 401
  Revisión manual: ErrorResponse con timestamp, status, error, message y details; sin secretos.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/tickets/{{ticketCancelableCode}}"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
order: 9000
