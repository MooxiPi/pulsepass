$kind: http-request
name: TC-AUTH-011-ISSUER | JWT rechazado wrongIssuer [401]
description: |-
  ID: TC-AUTH-011-ISSUER
  Objetivo: JWT rechazado wrongIssuer
  Precondiciones: wrongIssuerToken firmado offline con issuer distinto y clave de test controlada; recurso protegido.
  Actor: wrongIssuer
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 401
  Revisión manual: ErrorResponse con timestamp, status, error, message y details; sin secretos.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{wrongIssuerToken}}"
order: 35000
