$kind: http-request
name: NOAUTH-08 | Sin Bearer /api/tickets/by-user?email={{userAEmail}} [401]
description: |-
  ID: NOAUTH-08
  Objetivo: Sin Bearer /api/tickets/by-user?email={{userAEmail}}
  Precondiciones: USER_A tiene tickets PAID; buscar userAEmail sin Authorization.
  Actor: ANONYMOUS
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 401
  Revisión manual: ErrorResponse con timestamp, status, error, message y details; sin secretos.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/tickets/by-user?email={{userAEmail}}"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
order: 10000
