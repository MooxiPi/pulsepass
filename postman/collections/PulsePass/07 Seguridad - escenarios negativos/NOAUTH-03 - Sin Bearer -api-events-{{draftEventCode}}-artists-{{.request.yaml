$kind: http-request
name: NOAUTH-03 | Sin Bearer /api/events/{{draftEventCode}}/artists/{{artistId}} [401]
description: |-
  ID: NOAUTH-03
  Objetivo: Sin Bearer /api/events/{{draftEventCode}}/artists/{{artistId}}
  Precondiciones: draftEventCode y artistId existen; no enviar Authorization.
  Actor: ANONYMOUS
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 401
  Revisión manual: ErrorResponse con timestamp, status, error, message y details; sin secretos.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/events/{{draftEventCode}}/artists/{{artistId}}"
method: POST
headers:
  Accept: application/json
auth:
  type: noauth
order: 5000
