$kind: http-request
name: NOAUTH-10 | Sin Bearer /api/tickets/{{ticketCancelableCode}}/cancel [401]
description: |-
  ID: NOAUTH-10
  Objetivo: Sin Bearer /api/tickets/{{ticketCancelableCode}}/cancel
  Precondiciones: ticketCancelableCode propio de USER_A aún PAID; no enviar Authorization antes de cancelar.
  Actor: ANONYMOUS
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 401
  Revisión manual: ErrorResponse con timestamp, status, error, message y details; sin secretos.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/tickets/{{ticketCancelableCode}}/cancel"
method: PATCH
headers:
  Accept: application/json
auth:
  type: noauth
order: 12000
