$kind: http-request
name: TC-HTTP-409-AGE | 409-AGE [409]
description: |-
  ID: TC-HTTP-409-AGE
  Objetivo: 409-AGE
  Precondiciones: ageRestrictedEventCode exige 120 años; USER_A no cumple edad; userAToken vigente.
  Actor: userA
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 409
  Revisión manual: ErrorResponse con timestamp, status, error, message y details; sin secretos.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/tickets"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userEmail": "{{userAEmail}}",
      "eventCode": "{{ageRestrictedEventCode}}",
      "type": "GENERAL"
    }
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 13000
