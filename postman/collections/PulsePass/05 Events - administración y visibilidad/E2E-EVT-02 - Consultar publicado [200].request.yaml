$kind: http-request
name: E2E-EVT-02 | Consultar publicado [200]
description: |-
  ID: E2E-EVT-02
  Objetivo: Consultar publicado
  Precondiciones: publishedEventCode del seed existe y está PUBLISHED; repetir tras catálogo con el código recién publicado.
  Actor: ANONYMOUS
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 200
  Revisión manual: status=PUBLISHED, venueCode y artista correctos.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/events/{{publishedEventCode}}"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
order: 5000
