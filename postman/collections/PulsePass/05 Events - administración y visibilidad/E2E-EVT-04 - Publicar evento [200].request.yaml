$kind: http-request
name: E2E-EVT-04 | Publicar evento [200]
description: |-
  ID: E2E-EVT-04
  Objetivo: Publicar evento
  Precondiciones: Evento eventToPublishCode aún en DRAFT y artista asociado; adminToken vigente.
  Actor: admin
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 200
  Revisión manual: status=PUBLISHED; copiar eventToPublishCode a publishedEventCode y volver a leer sin token.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/events/{{eventToPublishCode}}/publish"
method: PATCH
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 4000
