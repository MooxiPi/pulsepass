$kind: http-request
name: E2E-TKT-02 | Consultar ticket propio [200]
description: |-
  ID: E2E-TKT-02
  Objetivo: Consultar ticket propio
  Precondiciones: ticketCancelableCode comprado por USER_A; consultar antes y después de cancelar.
  Actor: userA
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 200
  Revisión manual: Mismo propietario, evento, tipo, precio y status; antes de cancelar PAID, después CANCELLED.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/tickets/{{ticketCancelableCode}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 3000
