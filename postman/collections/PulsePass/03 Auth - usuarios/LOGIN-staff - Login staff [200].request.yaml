$kind: http-request
name: LOGIN-staff | Login staff [200]
description: |-
  ID: LOGIN-staff
  Objetivo: Login staff
  Precondiciones: Cuenta STAFF activa aprovisionada por seed; staffPassword local disponible.
  Actor: ANONYMOUS
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 200
  Revisión manual: tokenType=Bearer; expiresIn=900; copiar accessToken a staffToken LOCAL. No exportarlo.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{staffIdentifier}}",
      "password": "{{staffPassword}}"
    }
auth:
  type: noauth
order: 5000
