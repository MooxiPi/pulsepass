$kind: http-request
name: LOGIN-userB | Login userB [200]
description: |-
  ID: LOGIN-userB
  Objetivo: Login userB
  Precondiciones: USER_B registrado y activo; userBPassword local disponible.
  Actor: ANONYMOUS
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 200
  Revisión manual: tokenType=Bearer; expiresIn=900; copiar accessToken a userBToken LOCAL. No exportarlo.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{userBUsername}}",
      "password": "{{userBPassword}}"
    }
auth:
  type: noauth
order: 4000
