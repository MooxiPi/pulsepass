$kind: http-request
name: LOGIN-inactive | Login inactive [401]
description: |-
  ID: LOGIN-inactive
  Objetivo: Login inactive
  Precondiciones: Cuenta INACTIVE_USER inactiva aprovisionada por seed; inactivePassword local disponible.
  Actor: ANONYMOUS
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 401
  Revisión manual: Error genérico 401.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{inactiveIdentifier}}",
      "password": "{{inactivePassword}}"
    }
auth:
  type: noauth
order: 7000
