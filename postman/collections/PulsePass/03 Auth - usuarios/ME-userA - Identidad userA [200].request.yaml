$kind: http-request
name: ME-userA | Identidad userA [200]
description: |-
  ID: ME-userA
  Objetivo: Identidad userA
  Precondiciones: Login de USER_A completado; userAToken vigente copiado manualmente.
  Actor: userA
  Ejecución: abrir esta petición y pulsar Send individualmente.
  HTTP esperado: 200
  Revisión manual: userId, username, email y roles correctos; USER para A/B, STAFF o ADMIN en fixtures.
  Evidencia: anotar HTTP, JSON, estado persistido y PASS/FAIL/BLOCKED en registro-ejecucion-manual.md. No copiar tokens en evidencia.
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{userAToken}}"
order: 8000
