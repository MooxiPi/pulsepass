<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PulsePass: descubre eventos y gestiona tus entradas." />
    <title>PulsePass</title>
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo (preferencia visual, no datos sensibles).
      try {
        var t = window.localStorage.getItem('pulsepass.tema')
        var oscuro = t ? t === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', oscuro)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
