spring.application.name=PulsePass

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pulsepass}
spring.datasource.username=${DB_USERNAME:pulsepass}
spring.datasource.password=${DB_PASSWORD:pulsepass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

pulsepass.security.jwt.secret-base64=${PULSEPASS_JWT_SECRET_BASE64}
pulsepass.security.jwt.issuer=${PULSEPASS_JWT_ISSUER:pulsepass-api}
pulsepass.security.jwt.ttl-seconds=${PULSEPASS_JWT_TTL_SECONDS:900}

pulsepass.security.cors.allowed-origins=${PULSEPASS_CORS_ALLOWED_ORIGINS:}
